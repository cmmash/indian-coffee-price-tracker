services:
  - type: web
    name: indian-coffee-price-tracker
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: coffee-db
          property: connectionString

databases:
  - name: coffee-db
    databaseName: coffee_tracker
    user: coffee_user
