services:
  - type: web
    name: indian-coffee-price-tracker
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: indian-coffee-price-tracker-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: indian-coffee-price-tracker-db
    region: oregon
    plan: free
